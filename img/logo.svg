<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente que imita el bg-gradient-to-br from-brand-600 to-neutral-900 -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
  </defs>

  <!-- Caja contenedora redondeada con borde -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#brand-grad)" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4" />

  <!-- Ícono de Rayo (Zap) idéntico a Lucide en Blanco -->
  <polygon points="58,15 26,55 48,55 42,85 74,45 52,45" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Punto Neón superior derecho -->
  <circle cx="85" cy="15" r="8" fill="#f43f5e" />
</svg>
